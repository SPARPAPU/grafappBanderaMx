<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selector de Color RGB</title>
  <!-- Bootstrap CSS y Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">

  <main class="container py-4 my-auto">
    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">
        <div class="card main-card border-0 p-3 p-md-4">
          <div class="card-body">

            <!-- Encabezado con Icono estilo Paleta/Pincel -->
            <div class="text-center mb-4">
              <div class="app-icon-wrapper mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="app-icon">
                  <path d="M12 22C6.5 22 2 17.5 2 12S6.5 2 12 2s10 4.5 10 10c0 2.5-2 4.5-4.5 4.5H16a2 2 0 0 0-2 2c0 1.1-.9 2-2 2z"/>
                  <circle cx="7.5" cy="10.5" r=".5" fill="currentColor"/>
                  <circle cx="12" cy="7.5" r=".5" fill="currentColor"/>
                  <circle cx="16.5" cy="10.5" r=".5" fill="currentColor"/>
                  <path d="M18.5 15.5l2.5 2.5"/>
                </svg>
              </div>
              <h1 class="h3 fw-bold text-white mb-1">Selector de Color RGB</h1>
              <p class="text-secondary small">Ajusta los canales de color, visualiza el tono y copia sus códigos en tiempo real.</p>
            </div>

            <!-- Panel de 2 Columnas -->
            <div class="row g-4">
              
              <!-- Columna Izquierda: Controles RGB y Picker -->
              <div class="col-12 col-md-6">
                <div class="panel-box p-3 mb-3">
                  <h6 class="panel-title mb-3">
                    <i class="bi bi-sliders me-2"></i>Controles RGB
                  </h6>

                  <!-- Canal Rojo -->
                  <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                      <label for="red" class="form-label text-danger small fw-bold mb-0">
                        <span class="dot red-dot"></span>Rojo
                      </label>
                      <input type="number" class="form-control form-control-sm custom-input" id="red-num" min="0" max="255" value="255">
                    </div>
                    <input type="range" class="form-range range-red" id="red" min="0" max="255" value="255">
                  </div>

                  <!-- Canal Verde -->
                  <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                      <label for="green" class="form-label text-success small fw-bold mb-0">
                        <span class="dot green-dot"></span>Verde
                      </label>
                      <input type="number" class="form-control form-control-sm custom-input" id="green-num" min="0" max="255" value="0">
                    </div>
                    <input type="range" class="form-range range-green" id="green" min="0" max="255" value="0">
                  </div>

                  <!-- Canal Azul -->
                  <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                      <label for="blue" class="form-label text-primary small fw-bold mb-0">
                        <span class="dot blue-dot"></span>Azul
                      </label>
                      <input type="number" class="form-control form-control-sm custom-input" id="blue-num" min="0" max="255" value="0">
                    </div>
                    <input type="range" class="form-range range-blue" id="blue" min="0" max="255" value="0">
                  </div>
                </div>

                <!-- Bloque Seleccionar Color -->
                <div class="panel-box p-3 d-flex align-items-center justify-content-between">
                  <div class="d-flex align-items-center gap-3">
                    <input type="color" id="color-picker" class="picker-input" value="#FF0000">
                    <div>
                      <span class="d-block text-white small fw-bold">Seleccionar color</span>
                      <small class="text-secondary">Selecciona un color</small>
                    </div>
                  </div>
                  <i class="bi bi-palette text-secondary"></i>
                </div>
              </div>

              <!-- Columna Derecha: Previsualización y Códigos -->
              <div class="col-12 col-md-6">
                
                <!-- Recuadro de Vista previa (sin gotero) -->
                <div class="panel-box p-3 mb-3">
                  <h6 class="panel-title mb-3">
                    <i class="bi bi-eye me-2"></i>Vista previa
                  </h6>
                  <div id="preview" class="preview-box"></div>
                </div>

                <!-- Bloque de Código RGB -->
                <div class="code-box p-2 px-3 mb-2 d-flex align-items-center justify-content-between">
                  <div>
                    <span class="code-label d-block">RGB</span>
                    <strong id="rgb-value" class="code-text">rgb(255, 0, 0)</strong>
                  </div>
                  <button class="btn btn-copy" onclick="copyToClipboard('rgb-value')" title="Copiar RGB">
                    <i class="bi bi-copy"></i>
                  </button>
                </div>

                <!-- Bloque de Código HEX -->
                <div class="code-box p-2 px-3 d-flex align-items-center justify-content-between">
                  <div>
                    <span class="code-label d-block">HEX</span>
                    <strong id="hex-value" class="code-text">#FF0000</strong>
                  </div>
                  <button class="btn btn-copy" onclick="copyToClipboard('hex-value')" title="Copiar HEX">
                    <i class="bi bi-copy"></i>
                  </button>
                </div>

              </div>

            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Pie de página con textos en esquinas inferiores -->
  <footer class="p-3 d-flex justify-content-between align-items-center footer-watermarks">
    <span>Graficación - ISC</span>
    <span>Luis D. Pad.</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
